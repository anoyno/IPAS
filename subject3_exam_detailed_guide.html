    <script>
      const questions = [
        {
          no: 1,
          answer: "B",
          question:
            "某零售企業建立一個銷售預測模型，希望評估該模型在不同月份的新資料上，是否仍能維持穩定的預測表現。資料科學團隊計畫利用統計方法檢驗模型對未觀察資料的適應能力與泛化效果。下列哪一種方法最適合用於此目的？",
          options: {
            A: "F檢定（F-test）",
            B: "交叉驗證（Cross-Validation）",
            C: "配對樣本t檢定（Paired-sample t-test）",
            D: "卡方檢定（Chi-square Test）",
          },
          explanation:
            "【答案：B — 交叉驗證（Cross-Validation）】<br><br>題目核心需求是「評估模型對<b>未觀察資料</b>的泛化能力，並在<b>不同月份</b>維持穩定表現」，這正是交叉驗證的設計目的。<br><br><b>▍為什麼選 B？</b><br>交叉驗證將資料集切分成 k 份（k-fold），每次以其中一份作為驗證集、其餘作為訓練集，共訓練 k 次後取平均分數，能有效衡量模型在未見資料上的穩定表現，避免單次切分造成的偶然誤差。對於「不同月份新資料」的情境，也可採用 <b>Time-Series Split</b>（按時間序列劃分），確保訓練集永遠在驗證集之前，符合現實情境。<br><br><b>▍為什麼排除其他選項？</b><br><ul><li><b>A — F 檢定：</b>用來比較兩組以上樣本的<b>變異數</b>，或用於 ANOVA 中判斷各組均值是否有顯著差異，屬於假設檢定，與模型泛化評估無關。</li><li><b>C — 配對樣本 t 檢定：</b>用來檢驗<b>同一組受試者在兩種條件下</b>的平均差異是否顯著（如前測／後測），不適用於模型穩定性評估。</li><li><b>D — 卡方檢定：</b>用來檢驗兩個<b>類別型變數</b>之間的獨立性，例如性別與購買行為是否相關，不用於預測模型評估。</li></ul><b>▍一句話記憶：</b>「要看模型在新資料上是否穩定 → 交叉驗證；要做假設檢定 → 才用 t / F / 卡方」。",
          notes: [
            "💡 <b>名詞翻譯百科</b>（給初學者的白話解說）：<ul><li><b>泛化能力</b>：預測模型除了在訓練背熟答案外，真正在「面對沒看過的新資料」時也能給出準確預測的能力。</li><li><b>交叉驗證</b>：把資料切塊，輪流拿一塊當考卷、其他當練習題，藉此反覆測試模型真實實力的方法。</li><li><b>T檢定</b>：用來檢驗兩組樣本的「平均值」之間有沒有統計上的顯著差異。</li><li><b>卡方檢定</b>：用來檢驗兩個「類別型變數」（例如科系與性別）之間是不是有顯著的關聯性。</li></ul>",
          ],
          memoryTip: "看到「泛化能力、未觀察資料、穩定表現」就先想到交叉驗證。",
          mnemonic: "泛化先交叉",
          sourceKey: "subject3-official",
          sourceLabel: "第三科正式題",
          sectionLabel: "第三科｜正式考題",
          notesSummary: "名詞白話解說",
        },
        {
          no: 2,

      function updateThemeButton() {
        const dark = document.body.classList.contains("dark-mode");
        themeToggle.textContent = dark ? "☀️ Light Mode" : "🌙 Dark Mode";
        themeToggle.classList.toggle("active", dark);
      }

      function saveMarkedIds() {
        localStorage.setItem(STORAGE.review, JSON.stringify([...markedIds]));
      }

      function updateReviewFilterButton() {
        reviewFilterToggle.textContent = reviewOnlyMode
          ? "⭐ 顯示全部題目"
          : "⭐ 只看已標註題";
        reviewFilterToggle.classList.toggle("active", reviewOnlyMode);
      }

      function updateAnswerToggleButton() {
        answerToggle.textContent = allAnswersVisible
          ? "🙈 隱藏全部答案"
          : "👁️ 顯示全部答案";
        answerToggle.classList.toggle("active", allAnswersVisible);
      }

      function buildQuestionId(item) {
        return item.sourceKey + "-q-" + item.no;
      }

      function isVisibleByFilter(item, keyword, extraValue, answerValue) {
        const haystack = [
          item.question,
          item.explanation,
          item.memoryTip,
          item.mnemonic,
          ...(item.options ? Object.values(item.options) : []),
          ...(item.notes || []),
        ]
          .join(" ")
          .toLowerCase();
        const matchKeyword = !keyword || haystack.includes(keyword);
        const matchAnswer =
          answerValue === "all" || item.answer === answerValue;
        let matchExtra = true;
        if (filterType === "range" && extraValue !== "all") {
          const [start, end] = extraValue.split("-").map(Number);
          matchExtra = item.no >= start && item.no <= end;
        }
        if (filterType === "source" && extraValue !== "all") {
          matchExtra = item.sourceKey === extraValue;
        }
        const matchReview =
          !reviewOnlyMode || markedIds.has(buildQuestionId(item));
        return matchKeyword && matchAnswer && matchExtra && matchReview;
      }

      function answerBadgeHtml(item, questionId) {
        const visible = revealedIds.has(questionId);
        return (
          '<span class="badge answer ' +
          (visible ? "" : "is-hidden") +
          '" data-question-id="' +
          questionId +
          '" aria-pressed="' +
          (visible ? "true" : "false") +
          '" title="' +
          (visible ? "點擊隱藏答案" : "點擊顯示答案") +
          '">' +
          (visible ? "答案：" + item.answer : "點擊顯示答案") +
          "</span>"
        );
      }

      function render(items) {
        list.innerHTML = items
          .map((item) => {
            if (item.type === "instruction") {
              const notesHtml = (item.notes || [])
                .map(
                  (note) =>
                    '<div style="margin-bottom: 12px; font-size: 0.95rem;">' +
                    note +
                    "</div>",
                )
                .join("");
              return [
                '<section class="instruction-block">',
                '  <h2 class="instruction-title">' + item.title + "</h2>",
                '  <div class="instruction-content">',
                item.preamble
                  ? '    <div class="preamble"><p>' +
                    item.preamble +
                    "</p></div>"
                  : "",
                item.code
                  ? '    <div class="code-block"><pre><code>' +
                    item.code.replace(/</g, "&lt;").replace(/>/g, "&gt;") +
                    "</code></pre></div>"
                  : "",
                notesHtml
                  ? '    <div class="instruction-notes">' + notesHtml + "</div>"
                  : "",
                item.mediaPath
                  ? '    <div class="question-media"><img src="' +
                    item.mediaPath +
                    '" alt="資料集樣本視覺化" /></div>'
                  : "",
                item.additionalCode
                  ? '    <div class="code-block"><pre><code>' +
                    item.additionalCode
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;") +
                    "</code></pre></div>"
                  : "",
                item.model_summary
                  ? '    <div class="code-block"><pre><code>' +
                    item.model_summary
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;") +
                    "</code></pre></div>"
                  : "",
                "  </div>",
                "</section>",
              ].join("");
            }
            const questionId = buildQuestionId(item);
            const answerVisible = revealedIds.has(questionId);
            const optionsHtml = item.options
              ? Object.entries(item.options)
                  .map(
                    ([key, value]) =>
                      '<li class="' +
                      (item.answer === key ? "correct" : "") +
                      '"><strong>(' +
                      key +
                      ")</strong>" +
                      value +
                      "</li>",
                  )
                  .join("")
              : "";
            const notesHtml = (item.notes || [])
              .map((note) => "<li>" + note + "</li>")
              .join("");
            return [
              '<article class="question-card ' +
                (markedIds.has(questionId) ? "review-marked " : "") +
                (answerVisible ? "answer-visible" : "") +
                '" id="' +
                questionId +
                '" data-source-key="' +
                item.sourceKey +
                '">',
              '  <div class="card-top">',
              '    <span class="badge no">第 ' + item.no + " 題</span>",
              '    <span class="badge source">' + item.sourceLabel + "</span>",
              "    " + answerBadgeHtml(item, questionId),
              '    <button class="review-button ' +
                (markedIds.has(questionId) ? "active" : "") +
                '" type="button" data-review-id="' +
                questionId +
                '">' +
                (markedIds.has(questionId) ? "⭐ 已標註" : "☆ 標註複習") +
                "</button>",
              "  </div>",
              item.preamble
                ? '  <div class="preamble"><p>' + item.preamble + "</p></div>"
                : "",
              item.question
                ? '  <div class="question-text">' + item.question + "</div>"
                : "",
              item.questionMedia
                ? '  <figure class="question-media">' +
                  item.questionMedia +
                  "</figure>"
                : "",
              item.mediaPath
                ? '  <div class="question-media"><img src="' +
                  item.mediaPath +
                  '" alt="題目圖片" /></div>'
                : "",
              item.code
                ? '  <div class="code-block"><pre><code>' +
                  item.code.replace(/</g, "&lt;").replace(/>/g, "&gt;") +
                  "</code></pre></div>"
                : "",
              item.model_summary
                ? '  <div class="code-block"><pre><code>' +
                  item.model_summary
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;") +
                  "</code></pre></div>"
                : "",
              item.options
                ? '  <div class="choices-block">' +
                  '    <div class="choices-title">題目選項</div>' +
                  '    <ul class="choices">' +
                  optionsHtml +
                  "</ul>" +
                  "  </div>"
                : "",
              item.explanation
                ? '  <div class="explanation answer-dependent ' +
                  (answerVisible ? "" : "is-hidden") +
                  '"><strong>詳解：</strong>' +
                  item.explanation +
                  "</div>"
                : "",
              item.memoryTip || item.mnemonic
                ? '<div class="memory-box answer-dependent ' +
                  (answerVisible ? "" : "is-hidden") +
                  '"><h4>好記版解說</h4><p>' +
                  (item.memoryTip || "") +
                  "</p>" +
                  (item.mnemonic
                    ? '<div class="mnemonic">口訣：' + item.mnemonic + "</div>"
                    : "") +
                  "</div>"
                : "",
              "  <details>",
              "    <summary>" +
                (item.notesSummary || "題目選項相關背景知識") +
                "</summary>",
              '    <ul class="notes">' + notesHtml + "</ul>",
              "  </details>",
              "</article>",
            ].join("");
          })
          .join("");
        resultCount.textContent =
          "目前顯示 " + items.length + " 題／共 " + questions.length + " 題";
        wireCardInteractions(items);
        buildQuickNav(items);
        syncAnswerToggleState();
      }

      function setCardAnswerState(questionId, visible) {
        const card = document.getElementById(questionId);
        if (!card) return;
        const badge = card.querySelector(".badge.answer");
        const item = questions.find(
          (entry) => buildQuestionId(entry) === questionId,
        );
        if (!badge || !item) return;
        badge.classList.toggle("is-hidden", !visible);
        badge.textContent = visible ? "答案：" + item.answer : "點擊顯示答案";
        badge.setAttribute("aria-pressed", visible ? "true" : "false");
        badge.title = visible ? "點擊隱藏答案" : "點擊顯示答案";
        card.classList.toggle("answer-visible", visible);
        card
          .querySelectorAll(".answer-dependent")
          .forEach((el) => el.classList.toggle("is-hidden", !visible));
      }

      function wireCardInteractions(items) {
        document.querySelectorAll(".badge.answer").forEach((badge) => {
          badge.addEventListener("click", () => {
            const questionId = badge.dataset.questionId;
            if (revealedIds.has(questionId)) {
              revealedIds.delete(questionId);
              setCardAnswerState(questionId, false);
            } else {
              revealedIds.add(questionId);
              setCardAnswerState(questionId, true);
            }
            syncAnswerToggleState();
          });
        });

        document.querySelectorAll(".review-button").forEach((button) => {
          button.addEventListener("click", () => {
            const questionId = button.dataset.reviewId;
            if (markedIds.has(questionId)) {
              markedIds.delete(questionId);
            } else {
              markedIds.add(questionId);
            }
            saveMarkedIds();
            filterQuestions();
          });
        });
      }

      function syncAnswerToggleState() {
        const visibleIds = Array.from(
          list.querySelectorAll(".question-card"),
        ).map((card) => card.id);
        allAnswersVisible =
          visibleIds.length > 0 &&
          visibleIds.every((id) => revealedIds.has(id));
        updateAnswerToggleButton();
      }

      function buildQuickNav(items) {
        const groups = new Map();
        items.forEach((item) => {
          if (item.type === "instruction") return;
          if (!groups.has(item.sectionLabel)) groups.set(item.sectionLabel, []);
          groups.get(item.sectionLabel).push(item);
        });
        navRoot.innerHTML = Array.from(groups.entries())
          .map(([label, entries]) => {
            const links = entries
              .map((item) => {
                const questionId = buildQuestionId(item);
                const reviewClass = markedIds.has(questionId)
                  ? "review-link"
                  : "";
                return (
                  '<a class="' +
                  reviewClass +
                  '" href="#' +
                  questionId +
                  '">' +
                  item.no +
                  "</a>"
                );
              })
              .join("");
            return (
              '<section class="quick-nav-section"><div class="quick-nav-title">' +
              label +
              '</div><div class="quick-nav-links">' +
              links +
              "</div></section>"
            );
          })
          .join("");
      }

      function filterQuestions() {
        const keyword = searchInput.value.trim().toLowerCase();
        const extraValue = extraFilter.value;
        const answerValue = answerFilter.value;
        const filtered = questions.filter((item) =>
          isVisibleByFilter(item, keyword, extraValue, answerValue),
        );
        render(filtered);
        localStorage.setItem(STORAGE.reviewFilter, String(reviewOnlyMode));
        updateReviewFilterButton();
      }

      searchInput.addEventListener("input", filterQuestions);
      extraFilter.addEventListener("change", filterQuestions);
      answerFilter.addEventListener("change", filterQuestions);

      themeToggle.addEventListener("click", () => {
        document.body.classList.toggle("dark-mode");
        localStorage.setItem(
          STORAGE.theme,
          document.body.classList.contains("dark-mode") ? "dark" : "light",
        );
        updateThemeButton();
      });

      answerToggle.addEventListener("click", () => {
        const visibleIds = Array.from(
          list.querySelectorAll(".question-card"),
        ).map((card) => card.id);
        const shouldShow = !allAnswersVisible;
        visibleIds.forEach((id) => {
          if (shouldShow) revealedIds.add(id);
          else revealedIds.delete(id);
          setCardAnswerState(id, shouldShow);
        });
        syncAnswerToggleState();
      });

      reviewFilterToggle.addEventListener("click", () => {
        reviewOnlyMode = !reviewOnlyMode;
        filterQuestions();
      });

      updateThemeButton();
      updateReviewFilterButton();
      filterQuestions();

      // Quick-nav collapse / expand
      const quickNav = document.getElementById("quickNav");
      const quickNavToggle = document.getElementById("quickNavToggle");
      const NAV_COLLAPSED_KEY = "quickNavCollapsed";
      if (localStorage.getItem(NAV_COLLAPSED_KEY) === "true") {
        quickNav.classList.add("collapsed");
      }
      quickNavToggle.addEventListener("click", () => {
        quickNav.classList.toggle("collapsed");
        localStorage.setItem(
          NAV_COLLAPSED_KEY,
          quickNav.classList.contains("collapsed") ? "true" : "false",
        );
      });
    </script>
  </body>
</html>
